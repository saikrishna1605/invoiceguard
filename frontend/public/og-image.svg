<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0A0D12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#07090D" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Central Brand Icon -->
  <g transform="translate(540, 110)">
    <rect width="120" height="120" rx="32" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M60 25L30 38V60C30 80 43.5 98 60 102C76.5 98 90 80 90 60V38L60 25Z" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="4" stroke-linejoin="round"/>
    <path d="M48 61L56 70L73 52" stroke="#10B981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="600" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" letter-spacing="-0.02em">
    InvoiceGuard
  </text>

  <text x="600" y="355" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="url(#textGrad)" letter-spacing="0.05em">
    AI-POWERED INVOICE INTELLIGENCE
  </text>

  <text x="600" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="#94A3B8" letter-spacing="-0.01em">
    Stop paying invoices you shouldn't. Multi-agent validation with human control.
  </text>

  <!-- Principle Pill -->
  <g transform="translate(370, 480)">
    <rect width="460" height="48" rx="24" fill="#10141B" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <circle cx="32" cy="24" r="5" fill="#10B981"/>
    <text x="52" y="30" font-family="monospace" font-weight="600" font-size="14" fill="#A7F3D0" letter-spacing="0.04em">
      AI ANALYZES. EVIDENCE EXPLAINS. HUMANS DECIDE.
    </text>
  </g>
</svg>
